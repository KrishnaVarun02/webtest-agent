[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webtest-agent-orchestrator"
version = "0.1.0"
description = "Local planning and review service for WebTest Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<2",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
llm = ["openai>=1.58,<3"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
webtest-orchestrator = "webtest_agent_orchestrator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/webtest_agent_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

